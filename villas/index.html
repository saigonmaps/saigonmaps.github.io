<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Saigon Maps | Villas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/villas/villas.css" />
    <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  </head>
  <body>
    <div id="map"></div>

    <script type="module">
      import {
        STREETS_STYLE,
        SATELLITE_HYBRID_STYLE,
        StyleSwitcherControl,
        addCompassControl,
        setupMapKeyboardShortcuts,
        ExpandableMenuControl,
        createSiteNavPanel,
      } from "../shared.js";

      // --- 1. CONSTANTS ---
      const DATA_URL = "data.json";
      const SOURCE_ID = "villa-points-source";
      const UNCLUSTERED_LAYER_ID = "unclustered-point";
      const CLUSTERING_ENABLED = false;
      const siteMenuControl = new ExpandableMenuControl(
        createSiteNavPanel("villas")
      );
      let globalGeojsonData = null;

      // --- 2. CONFIG ---
      const map = new maplibregl.Map({
        container: "map",
        style: STREETS_STYLE,
        center: [106.7, 10.7769],
        zoom: 12,
        maxZoom: 24,
        maxBounds: [
          [106.3, 10.5],
          [107.1, 11.1],
        ],
        attributionControl: false,
      });

      map.on("styledata", () => {
        if (globalGeojsonData && !map.getSource(SOURCE_ID)) {
          applyCustomStylesAndLayers(globalGeojsonData);
        }
      });

      // 2.1: Use 'load' for utils
      map.on("load", () => {
        map.addControl(siteMenuControl, "top-left");

        map.addControl(
          new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true },
            trackUserLocation: true,
          }),
          "top-left"
        );

        const styleSwitcher = new StyleSwitcherControl({
          streets: STREETS_STYLE,
          satellite: SATELLITE_HYBRID_STYLE,
        });
        map.addControl(styleSwitcher, "top-left");
        addCompassControl(map, "top-left");
        setupMapKeyboardShortcuts({
          map,
          styleSwitcher,
          enableStyleToggle: true,
          enablePan: true,
          enableZoom: true,
        });

        map.addControl(
          new maplibregl.AttributionControl({
            customAttribution:
              '<a href="https://threads.com/@tomeyinhanoi" target="_blank">By Tomey</a>',
            compact: true,
          }),
          "bottom-left"
        );

        map.on("click", () => {
          siteMenuControl.close();
        });
      });

      // 2.2: Caching
      function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
            navigator.serviceWorker
              .register("./sw.js", { scope: "./" })
              .then((registration) => {
                console.log(
                  "ServiceWorker registration successful with scope: ",
                  registration.scope
                );
              })
              .catch((error) => {
                console.log("ServiceWorker registration failed: ", error);
              });
          });
        }
      }
      registerServiceWorker();

      // 2.3: Use 'idle' for main workflow.
      map.once("idle", mainWorkflow);

      // --- 3. WORKFLOW ---
      async function mainWorkflow() {
        try {
          globalGeojsonData = await loadAndParseData(DATA_URL); // 3.2
          applyCustomStylesAndLayers(globalGeojsonData);
        } catch (error) {
          console.error("Error:", error);
        }
      }

      function applyCustomStylesAndLayers(geojsonData) {
        modifyBaseStyle(map); // 3.1
        addDataLayer(map, geojsonData); // 3.3
        addInteractivity(map); // 3.4
      }

      // 3.1: Map styling
      function modifyBaseStyle(map) {
        // console.log(
        //   "All layer ids: ",
        //   map.getStyle().layers.map((layer) => layer.id)
        // );
        const layersToRecolor = ["Grass", "Meadow", "Forest", "Wood", "Scrub"];
        const layersToHide = [
          "Residential",
          "Industrial",
          "Other border",
          "Disputed border",
        ];
        const pathsToRecolor = ["Path", "Path minor"];

        const applyProperty = (layerIds, type, key, value) => {
          layerIds.forEach((id) => {
            if (map.getLayer(id)) {
              if (type === "paint") map.setPaintProperty(id, key, value);
              if (type === "layout") map.setLayoutProperty(id, key, value);
            }
          });
        };

        applyProperty(layersToRecolor, "paint", "fill-color", "#A1E8A1");
        applyProperty(layersToHide, "layout", "visibility", "none");
        applyProperty(pathsToRecolor, "paint", "line-color", "#efeeef");

        if (map.getLayer("Building") || map.getLayer("Building 3D")) {
          map.setLayerZoomRange("Building", 16, 24);
          map.setLayerZoomRange("Building 3D", 16, 24);
        }
      }

      // 3.2: Load GeoJSON
      async function loadAndParseData(url) {
        return new Promise((resolve, reject) => {
          const worker = new Worker("./webworker.js");
          worker.onmessage = (e) => {
            worker.terminate(); // Stop the worker when done
            if (e.data.error) {
              reject(new Error(e.data.error));
            } else {
              resolve(e.data.data);
            }
          };

          worker.onerror = (e) => {
            worker.terminate();
            reject(
              new Error(`Web Worker failed to start or execute: ${e.message}`)
            );
          };

          worker.postMessage({ url });
        });
      }

      // 3.3: Data layers
      function addDataLayer(map, geojsonData) {
        // Clean up old layers anytime add new data
        ["clusters", "cluster-count", UNCLUSTERED_LAYER_ID].forEach((id) => {
          if (map.getLayer(id)) map.removeLayer(id);
        });
        if (map.getSource(SOURCE_ID)) map.removeSource(SOURCE_ID);

        const sourceOptions = {
          type: "geojson",
          data: geojsonData,
        };

        if (CLUSTERING_ENABLED) {
          sourceOptions.cluster = true;
          sourceOptions.clusterMaxZoom = 16;
          sourceOptions.clusterRadius = 50;
        }

        map.addSource(SOURCE_ID, sourceOptions);

        if (CLUSTERING_ENABLED) {
          // 1st layer: clusters
          map.addLayer({
            id: "clusters",
            type: "circle",
            source: SOURCE_ID,
            filter: ["has", "point_count"], // Only apply to features with a point_count property (i.e., clusters)
            paint: {
              "circle-color": [
                "step",
                ["get", "point_count"],
                "#51bbd6", // Blue for < 100 points
                100,
                "#f1f075", // Yellow for 100-750 points
                750,
                "#f28cb1", // Pink for > 750 points
              ],
              "circle-radius": [
                "step",
                ["get", "point_count"],
                20, // 20px radius for < 100 points
                100,
                30, // 30px radius for 100-750 points
                750,
                40, // 40px radius for > 750 points
              ],
            },
          });

          // 2nd layer: cluster number
          map.addLayer({
            id: "cluster-count",
            type: "symbol",
            source: SOURCE_ID,
            filter: ["has", "point_count"],
            layout: {
              "text-field": "{point_count_abbreviated}",
              "text-font": ["Roboto Regular", "Arial Unicode MS Regular"],
              "text-size": 12,
            },
          });
        } // 3rd layer: unclustered points
        map.addLayer({
          id: UNCLUSTERED_LAYER_ID,
          type: "circle",
          source: SOURCE_ID,
          filter: ["!", ["has", "point_count"]], // Only apply to features that are NOT clusters
          paint: {
            "circle-color": "#FF5722",
            "circle-radius": [
              "interpolate",
              ["linear"],
              ["zoom"],
              15,
              5,
              22,
              24,
            ],
            "circle-stroke-width": 1,
            "circle-stroke-color": "#fff",
          },
        });
      }

      // 3.4: Interactions
      function addInteractivity(map) {
        // Popup for unclustered points
        map.on("click", UNCLUSTERED_LAYER_ID, (e) => {
          const props = e.features[0].properties;
          const coords = e.features[0].geometry?.coordinates;
          const markerId = props.id;
          console.log(markerId);
          if (props?.address && coords) {
            if (window.currentPopup) window.currentPopup.remove();

            map.flyTo({
              center: coords,
              offset: [0, 120],
              zoom: map.getZoom(),
              duration: 900,
              curve: 1.42,
              essential: true,
            });
            const googleMapsUrl = `https://www.google.com/maps/place/${encodeURIComponent(
              props.address
            )}`;
            const descriptions = props.description ? [props.description] : [];
            const descHTML =
              descriptions.length > 1
                ? `<div class="villa-popup-descriptions">${descriptions.map((d) => `<div>${d}</div>`).join("")}</div>`
                : descriptions.length === 1
                  ? `<div>${descriptions[0]}</div>`
                  : "";

            const popupHTML = `
              <div class="villa-popup-container">
                <div class="villa-popup-addr">${props.address}</div>
                <div class="villa-popup-type">${props.french_address || ""}
                  <br/><br/>
                  <span>${descHTML}</span>
                </div>
                <div class="villa-popup-link">
                  <div class="villa-popup-type">Nhóm: ${props.type || "?"}</div>
                  <a href="${googleMapsUrl}" target="_blank">Google Maps ↗</a>
                </div>
              </div>
            `;

            setTimeout(() => {
              window.currentPopup = new maplibregl.Popup({
                closeButton: false,
                focusAfterOpen: false,
                anchor: "bottom",
              })
                .setLngLat(coords)
                .setHTML(popupHTML)
                .addTo(map);
            }, 600);
          }
        });

        map.on("mouseenter", UNCLUSTERED_LAYER_ID, () => {
          map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", UNCLUSTERED_LAYER_ID, () => {
          map.getCanvas().style.cursor = "default";
        });

        if (CLUSTERING_ENABLED) {
          // Click clusters to zooms in
          map.on("click", "clusters", (e) => {
            const features = map.queryRenderedFeatures(e.point, {
              layers: ["clusters"],
            });
            if (!features.length) {
              return;
            }
            const cluster = features[0];
            const pointCount = cluster.properties.point_count;
            if (pointCount <= 5) {
              const clusterId = cluster.properties.cluster_id;
              map
                .getSource(SOURCE_ID)
                .getClusterExpansionZoom(clusterId, (err, zoom) => {
                  if (err) return;
                  map.flyTo({
                    center: cluster.geometry.coordinates,
                    zoom: zoom,
                    speed: 0.6,
                    duration: 1700,
                  });
                });
            }
          });

          // Cursor = pointer
          map.on("mouseenter", "clusters", () => {
            map.getCanvas().style.cursor = "pointer";
          });
          map.on("mouseleave", "clusters", () => {
            map.getCanvas().style.cursor = "default";
          });
        }
      }
    </script>
  </body>
</html>
